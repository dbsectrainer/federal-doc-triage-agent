name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check agents workflows tests lambda scripts test_local.py

      - name: Dependency security audit
        run: python -m pip_audit -r requirements.txt

      - name: Compile
        run: python -m compileall -q agents workflows lambda test_local.py

      - name: Unit and integration tests
        run: |
          python -m pytest tests/ -v \
            --cov=agents --cov=workflows --cov-report=term-missing

      - name: Local smoke checks
        run: python test_local.py

      - name: Demo every sample document
        run: |
          for sample in samples/*.txt; do
            python -m agents.demo "$sample"
          done

  docker:
    name: Container build and demo
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t federal-doc-triage-agent:ci .

      - name: Verify image has no local .env
        run: |
          if docker run --rm federal-doc-triage-agent:ci test -f /app/.env; then
            echo "Unexpected .env in image" >&2
            exit 1
          fi

      - name: Run demo in container
        run: docker run --rm federal-doc-triage-agent:ci

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
